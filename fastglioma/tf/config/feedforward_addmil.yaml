infra:
    log_dir: /nfs/turbo/umms-tocho-snr/exp/akhilk/ # where all the experiments are
    exp_name: fastglioma_dev/ # where you want to save the inference results
    comment: inference_tensorflow # can use this to customize for each inference
    hf_repo: mlinslab/fastglioma # specify huggingface repo to be used
    seed: 1000
data:
    db_root: /nfs/turbo/umms-tocho/data/opensrh/
    studies: ["NIO_001"] # val or specify studies (e.g., ["NIO_001", "NIO_004"])
    patch_input: highres # {highres, lowres}
    use_patient_class: true # whether to use patient or slide class for inference
model:
    patch:
        backbone:
            which: resnet34
            params:
                num_channel_in: 3 # {1: lowres, 3: highres}
        mlp_hidden: []
        num_embedding_out: 128
    slide:
        mil:
            which: addmil
            params: {dim: 512, hidden_dim: 512, W_out: 1, mlp_hidden_dims: [512], mlp_out_dim: 1, drop_rate: 0.2, use_gating: true, use_norm: true}
        mlp_hidden: [512]
eval:
    predict_batch_size: 1 # tf feedforward only supported on cpu, keep at 1 for now
    ckpt_path: fastglioma_highres_model.ckpt # path to ckpt in huggingface repo
    compare_to_torch: true # compare to torch model on dummy data